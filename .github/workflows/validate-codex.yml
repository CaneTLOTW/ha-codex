name: Validate Codex App

on:
  pull_request:
    paths:
      - "codex/**"
      - "repository.yaml"
      - "MIGRATION.md"
      - "README.md"
      - ".github/workflows/validate-codex.yml"
      - ".github/workflows/publish-codex.yml"
      - ".github/workflows/publish-deployment.yml"
      - ".github/workflows/propose-codex-cli-update.yml"
  push:
    branches:
      - "deployment"
      - "feat/**"
      - "chore/**"
    paths:
      - "codex/**"
      - "repository.yaml"
      - "MIGRATION.md"
      - "README.md"
      - ".github/workflows/validate-codex.yml"
      - ".github/workflows/publish-codex.yml"
      - ".github/workflows/publish-deployment.yml"
      - ".github/workflows/propose-codex-cli-update.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Python regression tests
        run: python -m unittest discover -s codex/tests -v

      - name: Shell syntax
        run: |
          bash -n scripts/update-codex-version.sh
          bash -n codex/rootfs/usr/local/bin/codex-start
          bash -n codex/rootfs/usr/local/bin/codex-session
          bash -n codex/rootfs/usr/local/bin/codex-shell

      - name: Parse Home Assistant YAML and translation coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          repository = Path("repository.yaml")
          config_path = Path("codex/config.yaml")
          translation_paths = sorted(Path("codex/translations").glob("*.yaml"))

          with repository.open("r", encoding="utf-8") as handle:
              yaml.safe_load(handle)
          print(f"parsed {repository}")

          with config_path.open("r", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)
          print(f"parsed {config_path}")

          schema_keys = set(config.get("schema", {}))
          if not schema_keys:
              raise SystemExit("codex/config.yaml has no schema keys")

          if not translation_paths:
              raise SystemExit("no App translation files found")

          for path in translation_paths:
              with path.open("r", encoding="utf-8") as handle:
                  translation = yaml.safe_load(handle) or {}
              translated_keys = set((translation.get("configuration") or {}).keys())
              missing = sorted(schema_keys - translated_keys)
              extra = sorted(translated_keys - schema_keys)
              if missing or extra:
                  raise SystemExit(
                      f"{path}: translation/schema mismatch; missing={missing}, extra={extra}"
                  )
              print(f"parsed {path}; configuration coverage OK")
          PY

      - name: Reject legacy Home Assistant build.yaml
        run: test ! -e codex/build.yaml

      - name: Validate canonical ttyd patch against clean 1.7.7
        run: |
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-1.7.7
          git -C /tmp/ttyd-1.7.7 apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-1.7.7 diff --check

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

  build-amd64:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Build amd64 App image
        run: |
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' codex/config.yaml)" \
            -t ha-codex-validation \
            codex
