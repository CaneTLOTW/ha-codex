name: Materialize dev.5 desktop selection scroll

on:
  push:
    branches:
      - deployment
    paths:
      - ".github/workflows/materialize-dev5-desktop-selection.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment
        uses: actions/checkout@v6
        with:
          ref: deployment
          fetch-depth: 0

      - name: Build canonical ttyd patch with desktop selection scroll
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ttyd-1.7.7 /tmp/ttyd-check
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-1.7.7
          git -C /tmp/ttyd-1.7.7 apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/ttyd-1.7.7/html/src/components/terminal/xterm/index.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "    private nativeSelectionCapable = false;\n    private nativeSelectionMode = false;\n",
              "    private nativeSelectionCapable = false;\n    private nativeSelectionMode = false;\n"
              "    private desktopSelectionActive = false;\n"
              "    private desktopSelectionPointer?: { x: number; y: number };\n"
              "    private desktopSelectionScrollDirection = 0;\n"
              "    private desktopSelectionScrollTimer?: number;\n",
              'desktop selection fields',
          )

          replace_once(
              "        terminal.open(parent);\n        this.installNativeTouchSelection();\n        fitAddon.fit();\n",
              "        terminal.open(parent);\n        this.installNativeTouchSelection();\n"
              "        this.installDesktopShiftSelectionScroll();\n"
              "        fitAddon.fit();\n",
              'desktop selection install call',
          )

          marker = "    private applyNativeSelectionState() {\n"
          methods = r'''    private installDesktopShiftSelectionScroll() {
        if (this.nativeSelectionCapable || !this.terminal.element) return;

        const terminalElement = this.terminal.element;
        const screenElement = terminalElement.querySelector('.xterm-screen') as HTMLElement | null;
        if (!screenElement) return;

        const updatePointer = (event: MouseEvent) => {
            if (!this.desktopSelectionActive) return;
            this.desktopSelectionPointer = { x: event.clientX, y: event.clientY };

            const bounds = screenElement.getBoundingClientRect();
            const threshold = Math.min(36, Math.max(18, bounds.height * 0.06));
            let direction = 0;
            if (event.clientY <= bounds.top + threshold) direction = -1;
            else if (event.clientY >= bounds.bottom - threshold) direction = 1;
            this.setDesktopSelectionScrollDirection(direction);
        };

        const startSelection = (event: Event) => {
            const mouseEvent = event as MouseEvent;
            const target = mouseEvent.target as Element | null;
            if (mouseEvent.button !== 0 || !mouseEvent.shiftKey || !target?.closest('.xterm-screen')) return;
            this.desktopSelectionActive = true;
            updatePointer(mouseEvent);
        };
        const moveSelection = (event: Event) => updatePointer(event as MouseEvent);
        const stopSelection = () => this.stopDesktopSelectionScroll();

        this.register(addCapturedEventListener(terminalElement, 'mousedown', startSelection));
        this.register(addCapturedEventListener(terminalElement.ownerDocument, 'mousemove', moveSelection));
        this.register(addCapturedEventListener(terminalElement.ownerDocument, 'mouseup', stopSelection));
        this.register(addCapturedEventListener(window, 'blur', stopSelection));
        this.register(toDisposable(stopSelection));

        this.terminal.attachCustomWheelEventHandler(event => {
            if (!event.shiftKey) return true;
            event.preventDefault();
            event.stopPropagation();
            this.scrollDesktopSelectionWheel(event);
            if (this.desktopSelectionActive) this.replayDesktopSelectionMove();
            return false;
        });
    }

    private scrollDesktopSelectionWheel(event: WheelEvent) {
        if (!event.deltaY) return;
        let lines = event.deltaY;
        if (event.deltaMode === 0) lines /= 40;
        else if (event.deltaMode === 2) lines *= this.terminal.rows;

        let amount = Math.trunc(lines);
        if (!amount) amount = Math.sign(event.deltaY);
        amount = Math.max(-this.terminal.rows, Math.min(this.terminal.rows, amount));
        this.terminal.scrollLines(amount);
    }

    private setDesktopSelectionScrollDirection(direction: number) {
        this.desktopSelectionScrollDirection = direction;
        if (!direction) {
            if (this.desktopSelectionScrollTimer !== undefined) {
                window.clearInterval(this.desktopSelectionScrollTimer);
                this.desktopSelectionScrollTimer = undefined;
            }
            return;
        }
        if (this.desktopSelectionScrollTimer !== undefined) return;

        this.desktopSelectionScrollTimer = window.setInterval(() => {
            if (!this.desktopSelectionActive || !this.desktopSelectionScrollDirection) return;
            this.terminal.scrollLines(this.desktopSelectionScrollDirection);
            this.replayDesktopSelectionMove();
        }, 50);
    }

    private replayDesktopSelectionMove() {
        if (!this.desktopSelectionActive || !this.desktopSelectionPointer || !this.terminal.element) return;
        const ownerDocument = this.terminal.element.ownerDocument;
        ownerDocument.dispatchEvent(
            new MouseEvent('mousemove', {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: this.desktopSelectionPointer.x,
                clientY: this.desktopSelectionPointer.y,
                buttons: 1,
                shiftKey: true,
            })
        );
    }

    private stopDesktopSelectionScroll() {
        this.desktopSelectionActive = false;
        this.desktopSelectionPointer = undefined;
        this.desktopSelectionScrollDirection = 0;
        if (this.desktopSelectionScrollTimer !== undefined) {
            window.clearInterval(this.desktopSelectionScrollTimer);
            this.desktopSelectionScrollTimer = undefined;
        }
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('native selection state marker missing or ambiguous')
          text = text.replace(marker, methods + marker, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('codex/tests/test_modernization.py')
          t = test.read_text(encoding='utf-8')
          old = '''        self.assertIn("if (!this.touchControls) this.container = c as HTMLElement;", patch)\n        self.assertNotIn("if (!window.matchMedia('(hover: none), (pointer: coarse), (max-width: 768px)').matches)", patch)\n'''
          new = old + '''        # Desktop forced selection keeps wheel/edge scrolling local to xterm even when the TUI reports mouse events.\n        self.assertIn("installDesktopShiftSelectionScroll", patch)\n        self.assertIn("attachCustomWheelEventHandler", patch)\n        self.assertIn("if (!event.shiftKey) return true", patch)\n        self.assertIn("scrollDesktopSelectionWheel", patch)\n        self.assertIn("setDesktopSelectionScrollDirection", patch)\n        self.assertIn("replayDesktopSelectionMove", patch)\n'''
          if t.count(old) != 1:
              raise SystemExit('desktop regression test marker missing or ambiguous')
          test.write_text(t.replace(old, new, 1), encoding='utf-8')

          readme = Path('codex/ttyd-mobile-keys/README.md')
          d = readme.read_text(encoding='utf-8')
          note = '''\n### Desktop selection scroll in Home Assistant ingress\n\nOn desktop, Shift-forced xterm selection keeps wheel events local to the xterm scrollback instead of forwarding them to the mouse-aware TUI. A small in-frame edge zone also drives selection scrolling before the pointer leaves the Home Assistant ingress iframe, preserving multi-screen selection without changing the touch/mobile path.\n'''
          if '### Desktop selection scroll in Home Assistant ingress' not in d:
              readme.write_text(d.rstrip() + '\n' + note, encoding='utf-8')
          PY

          cd /tmp/ttyd-1.7.7/html
          corepack enable
          yarn install --immutable
          yarn inline
          cd "$GITHUB_WORKSPACE"

          git -C /tmp/ttyd-1.7.7 diff -- html/src/components/terminal/index.tsx html/src/components/terminal/xterm/index.ts html/src/style/index.scss html/src/template.html > codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch')
          lines = p.read_text(encoding='utf-8').splitlines()
          p.write_text('\n'.join('' if not line.strip() else line for line in lines) + '\n', encoding='utf-8')
          PY

      - name: Verify canonical patch and regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find codex/ttyd-mobile-keys -maxdepth 1 -name '*.patch' -type f | wc -l)" -eq 1
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-check
          git -C /tmp/ttyd-check apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-check apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-check diff --check
          python3 -m unittest discover -s codex/tests -v
          git diff --check

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch codex/ttyd-mobile-keys/README.md codex/tests/test_modernization.py
          git diff --cached --check
          git commit -m "fix: restore desktop selection scrolling in ingress"
          git push origin HEAD:deployment
