name: Prepare stable 0.4.8

on:
  push:
    branches:
      - release/0.4.8
    paths:
      - ".github/workflows/prepare-stable-0.4.8.yml"

permissions:
  contents: write

jobs:
  prepare:
    name: Promote accepted deployment state
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.4.8
          fetch-depth: 0

      - name: Import accepted deployment product state
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          stable_codex_version="$(sed -nE 's/^ARG CODEX_VERSION=([^[:space:]]+).*$/\1/p' codex/Dockerfile)"
          test -n "${stable_codex_version}"

          git fetch origin deployment
          git checkout origin/deployment -- \
            .gitattributes \
            AGENTS.md \
            codex \
            docs \
            .github/workflows/publish-deployment.yml \
            .github/workflows/validate-codex.yml

          # Preserve stable-channel metadata/history from the current main line.
          git checkout "${base_sha}" -- codex/config.yaml codex/CHANGELOG.md

          STABLE_CODEX_VERSION="${stable_codex_version}" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          dockerfile = Path('codex/Dockerfile')
          text = dockerfile.read_text()
          version = os.environ['STABLE_CODEX_VERSION']
          text, count = re.subn(r'^ARG CODEX_VERSION=.*$', f'ARG CODEX_VERSION={version}', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit('unable to preserve stable Codex CLI version')
          dockerfile.write_text(text)

          config = Path('codex/config.yaml')
          text = config.read_text()
          old = 'version: "0.4.7"'
          new = 'version: "0.4.8"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stable version marker {old!r}')
          config.write_text(text.replace(old, new))

          changelog = Path('codex/CHANGELOG.md')
          text = changelog.read_text()
          anchor = '## [0.4.7] - 2026-09-04\n'
          if text.count(anchor) != 1:
              raise SystemExit('0.4.7 changelog anchor missing or duplicated')
          release = '''## [0.4.8] - 2026-09-04

### Added
- Add hardened iOS native terminal selection/paste handling and touch-only mobile terminal controls.
- Add software-keyboard avoidance so the active terminal prompt remains visible above the iPhone/iPad keyboard in Home Assistant ingress.
- Add read-only Home Assistant diagnostic helpers and expanded in-container troubleshooting tooling for Codex sessions.

### Fixed
- Preserve the accepted Desktop wheel, text-selection, clipboard, right-click, and reconnect behavior while keeping mobile-only handling isolated.
- Canonicalize the ttyd 1.7.7 mobile patch with typed Visual Viewport handling and remove the temporary dev.12 Gate 5 build workaround.

### Changed
- Promote the iPhone- and Desktop-accepted `0.4.4-dev.12` deployment state to stable while retaining the newer stable Codex CLI version.

'''
          changelog.write_text(text.replace(anchor, release + anchor))
          PY

          # The preparation workflow is intentionally one-shot and must not land in main.
          rm -f .github/workflows/prepare-stable-0.4.8.yml

          git diff --check
          git status --short

      - name: Commit stable release candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare 0.4.8"
          git push origin HEAD:release/0.4.8
