name: Materialize dev.4 Codex update guard

on:
  push:
    branches:
      - deployment
    paths:
      - ".github/workflows/materialize-dev4-update-guard.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment
        uses: actions/checkout@v6
        with:
          ref: deployment
          fetch-depth: 0

      - name: Apply update guard and CLI sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "codex/rootfs/usr/local/bin/codex-merge-config",
              "    config = load_existing_config(config_path)\n    semantic_repairs = repair_incompatible_codex_values(config)\n",
              "    config = load_existing_config(config_path)\n    # The Home Assistant App is image-pinned. Runtime self-update prompts must stay disabled.\n    config[\"check_for_update_on_startup\"] = False\n    semantic_repairs = repair_incompatible_codex_values(config)\n",
              "managed update check",
          )
          replace_once(
              "codex/rootfs/usr/local/bin/codex-shell",
              "    codex -c 'tui.alternate_screen=\"never\"'\n",
              "    codex -c 'tui.alternate_screen=\"never\"' -c 'check_for_update_on_startup=false'\n",
              "CLI update check override",
          )
          replace_once(
              "codex/Dockerfile",
              "ARG CODEX_VERSION=0.151.0\n",
              "ARG CODEX_VERSION=0.152.1\n",
              "deployment Codex CLI version",
          )

          test_path = Path("codex/tests/test_modernization.py")
          text = test_path.read_text(encoding="utf-8")
          marker = '''    def test_mobile_terminal_patch_is_canonical_and_served(self):\n'''
          test = '''    def test_runtime_codex_self_update_is_disabled(self):\n        shell_text = SHELL.read_text(encoding="utf-8")\n        dockerfile = DOCKERFILE.read_text(encoding="utf-8")\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            config = root / "config.toml"\n            managed = root / "mcp.json"\n            config.write_text("check_for_update_on_startup = true\\n", encoding="utf-8")\n            managed.write_text("[]\\n", encoding="utf-8")\n            result = self.run_merge(config, managed)\n            self.assertEqual(result.returncode, 0, result.stderr)\n            parsed = tomllib.loads(config.read_text(encoding="utf-8"))\n            self.assertIs(parsed["check_for_update_on_startup"], False)\n        self.assertIn("check_for_update_on_startup=false", shell_text)\n        self.assertIn("ARG CODEX_VERSION=0.152.1", dockerfile)\n\n'''
          if test not in text:
              if text.count(marker) != 1:
                  raise SystemExit("test insertion marker missing or ambiguous")
              text = text.replace(marker, test + marker, 1)
              test_path.write_text(text, encoding="utf-8")
          PY

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          bash -n codex/rootfs/usr/local/bin/codex-shell
          python3 -m unittest discover -s codex/tests -v
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-1.7.7
          git -C /tmp/ttyd-1.7.7 apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git diff --check

      - name: Commit update guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/rootfs/usr/local/bin/codex-merge-config codex/rootfs/usr/local/bin/codex-shell codex/Dockerfile codex/tests/test_modernization.py
          git diff --cached --check
          git commit -m "fix: disable runtime Codex self-update in deployment"
          git push origin HEAD:deployment
