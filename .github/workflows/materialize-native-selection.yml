name: Reorder mobile toolbar for iOS ergonomics

on:
  push:
    branches:
      - pr1-native-selection-payload
    paths:
      - ".github/workflows/materialize-native-selection.yml"

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/upstream-mobile-mcp-modernization
          fetch-depth: 0

      - name: Regenerate single canonical ttyd patch
        shell: bash
        run: |
          set -euo pipefail
          expected_head="6df5c5bf7742acfc54d65db48df8e6e555d63712"
          test "$(git rev-parse HEAD)" = "$expected_head"

          rm -rf /tmp/ttyd-1.7.7
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-1.7.7
          git -C /tmp/ttyd-1.7.7 apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"

          python - <<'PY'
          from pathlib import Path

          terminal = Path('/tmp/ttyd-1.7.7/html/src/components/terminal/index.tsx')
          text = terminal.read_text()

          old_lines = [
              "                    {mobileKeys.slice(0, 2).map(this.renderMobileKey)}",
              "                    {this.renderModifier('Ctrl', ctrl, 'ctrl')}",
              "                    {this.renderModifier('Alt', alt, 'alt')}",
              "                    {this.renderModifier('Shift', shift, 'shift')}",
              "                    {this.renderShiftLock(shiftLock)}",
              "                    {this.renderSelectionMode(selectionMode)}",
              "                    {this.renderKeyboardDismiss()}",
              "                    {mobileKeys.slice(2).map(this.renderMobileKey)}",
              "                    {this.renderKeyboardShow()}",
          ]
          new_lines = [
              "                    {mobileKeys.slice(2, 7).map(this.renderMobileKey)}",
              "                    {this.renderSelectionMode(selectionMode)}",
              "                    {mobileKeys.slice(7, 8).map(this.renderMobileKey)}",
              "                    {this.renderKeyboardShow()}",
              "                    {mobileKeys.slice(0, 2).map(this.renderMobileKey)}",
              "                    {this.renderModifier('Ctrl', ctrl, 'ctrl')}",
              "                    {this.renderModifier('Alt', alt, 'alt')}",
              "                    {this.renderModifier('Shift', shift, 'shift')}",
              "                    {this.renderShiftLock(shiftLock)}",
              "                    {mobileKeys.slice(8, 9).map(this.renderMobileKey)}",
              "                    {this.renderKeyboardDismiss()}",
          ]
          old = "\n".join(old_lines) + "\n"
          new = "\n".join(new_lines) + "\n"
          if old not in text:
              raise SystemExit('current toolbar render block not found')
          terminal.write_text(text.replace(old, new, 1))
          PY

          git -C /tmp/ttyd-1.7.7 diff --no-ext-diff > codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch
          sed -i 's/^ $//' codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch
          git -C /tmp/ttyd-1.7.7 reset --hard HEAD
          git -C /tmp/ttyd-1.7.7 apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"

      - name: Extend regression contract and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tests = Path('codex/tests/test_modernization.py')
          text = tests.read_text()
          anchor = '        self.assertIn("public showKeyboard()", patch)\n        self.assertIn("if (!this.isModifierInput(data)) return data;", patch)\n'
          replacement = anchor + '        self.assertIn("mobileKeys.slice(2, 7).map(this.renderMobileKey)", patch)\n        self.assertIn("mobileKeys.slice(7, 8).map(this.renderMobileKey)", patch)\n        self.assertIn("mobileKeys.slice(8, 9).map(this.renderMobileKey)", patch)\n'
          if anchor not in text:
              raise SystemExit('test toolbar anchor not found')
          tests.write_text(text.replace(anchor, replacement, 1))

          readme = Path('codex/ttyd-mobile-keys/README.md')
          text = readme.read_text()
          marker = "scrolling. The App's tmux configuration maps `PgUp` and `PgDn` to copy-mode\nnavigation when session persistence is enabled.\n"
          rows = "\nThe current mobile row order is intentionally optimized for iOS reachability:\n\n- row 1: `Enter`, `←`, `↓`, `↑`, `→`, `Sel`, `PgUp`, `Kbd↑`\n- row 2: `Esc`, `Tab`, `Ctrl`, `Alt`, `Shift`, `⇪`, `PgDn`, `Kbd↓`\n"
          if marker not in text:
              raise SystemExit('README row-order anchor not found')
          readme.write_text(text.replace(marker, marker + rows, 1))
          PY

          git diff --check
          python -m unittest discover -s codex/tests -v

      - name: Commit canonical update to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch codex/tests/test_modernization.py codex/ttyd-mobile-keys/README.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: reorder mobile toolbar for iOS reachability"
          git push origin HEAD:feat/upstream-mobile-mcp-modernization
