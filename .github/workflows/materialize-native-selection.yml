name: Materialize native selection patch

on:
  push:
    branches:
      - pr1-native-selection-payload
    paths:
      - ".github/workflows/materialize-native-selection.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/upstream-mobile-mcp-modernization
          fetch-depth: 0

      - name: Verify target and materialize canonical patch
        shell: bash
        run: |
          set -euo pipefail
          expected_head="de025aa1d004b79f8ce68cdd05e587164d65fdbe"
          test "$(git rev-parse HEAD)" = "$expected_head"

          # Use the already byte-verified payload commit, not the later transport attempt.
          git show d464b2a6cfb8cb5c3c916795363ae41d9f5d1301:codex/ttyd-mobile-keys/.native-selection-patch.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch

          # Normalize only empty unified-diff context lines (single SP -> empty line).
          sed -i 's/^ $//' codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch

          echo "ef3a9de60a7fa9822c8a730f675467baaad3a29a21704ae55ddf4a27a49b2c14  codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch" | sha256sum --check
          git diff --check

          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-1.7.7
          git -C /tmp/ttyd-1.7.7 apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"

      - name: Commit exact patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch
          git diff --cached --quiet && exit 0
          git commit -m "feat: add native iOS terminal selection mode"
          git push origin HEAD:feat/upstream-mobile-mcp-modernization
