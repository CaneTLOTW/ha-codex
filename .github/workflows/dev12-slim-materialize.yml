name: Materialize slim dev.12 keyboard avoidance

on:
  push:
    branches: [deployment]
    paths:
      - .github/workflows/dev12-slim-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deployment
          fetch-depth: 0
      - name: Regenerate canonical patch
        run: python3 .github/dev12-slim.py
      - name: Commit regenerated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch codex/ttyd-mobile-keys/README.md
          git diff --cached --check
          git commit -m "refactor: simplify dev.12 keyboard avoidance"
          git push origin HEAD:deployment
