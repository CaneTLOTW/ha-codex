name: Adoption statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/adoption-statistics.yml'
      - 'scripts/adoption/**'
permissions:
  contents: write
concurrency:
  group: adoption-statistics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Validate parser
        run: python3 -m unittest discover -s scripts/adoption -p 'test_*.py'
      - name: Collect public counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/adoption/collect_adoption.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save aggregate snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/adoption
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(stats): record adoption snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
