name: Render branding assets

on:
  push:
    branches:
      - feat/app-branding
    paths:
      - "codex/branding/**"
      - ".github/workflows/render-branding.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render PNG assets
        run: |
          chmod +x codex/branding/render.sh
          ./codex/branding/render.sh

      - name: Verify generated assets
        run: |
          git diff --check
          file codex/icon.png codex/logo.png

      - name: Commit rendered PNG assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/icon.png codex/logo.png
          git diff --cached --quiet && exit 0
          git commit -m "feat: render dedicated Home Assistant app branding"
          git push origin HEAD:feat/app-branding
