name: Gate 5 amd64 Runtime Publish

on:
  push:
    branches:
      - deployment
    paths:
      - ".github/workflows/gate5-amd64-runtime.yml"
  workflow_dispatch:

# Temporary runtime-acceptance path for dev.12.
# It deliberately builds the exact accepted dev.12 source commit and publishes
# only amd64 under the already advertised version tag. The normal deployment
# workflow remains responsible for the final amd64+aarch64 manifest.
env:
  TARGET_SHA: e26e6e571e51e628c754da5c353fa6fd94c5daac
  VERSION: 0.4.4-dev.12
  ARCHITECTURES: '["amd64"]'
  IMAGE_NAME: ha-codex
  REGISTRY_PREFIX: ghcr.io/canetlotw

permissions:
  contents: read

jobs:
  init:
    name: Prepare amd64 Gate 5 build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Prepare amd64 matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build Gate 5 amd64
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out exact dev.12 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify pinned source version
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          grep -F 'version: "0.4.4-dev.12"' codex/config.yaml

      - name: Apply Gate 5 type-only ttyd lint fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch')
          text = path.read_text()
          replacements = {
              'private keyboardViewport: any;': 'private keyboardViewport?: VisualViewport;',
              'private keyboardResizeHandler: any;': 'private keyboardResizeHandler?: () => void;',
              'const topWindow = window.top as any;': 'const topWindow = window.top;',
              'return (window as any).visualViewport;': 'return window.visualViewport;',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          git diff --check
          git diff -- codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build Gate 5 image with diagnostic capture
        id: docker-build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_IMAGE: ${{ matrix.image }}:${{ env.VERSION }}
        run: |
          set +e
          docker build \
            --progress=plain \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_ARCH=amd64 \
            --label io.hass.name="Codex Deployment" \
            --label io.hass.description="Temporary amd64 Gate 5 runtime acceptance image" \
            --label io.hass.type=app \
            --label io.hass.gate5-source="${TARGET_SHA}" \
            -t "${TARGET_IMAGE}" \
            codex 2>&1 | tee /tmp/gate5-build.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "${status}" -ne 0 ]; then
            {
              echo "## Gate 5 amd64 build diagnostic"
              echo
              echo "Pinned source: \`${TARGET_SHA}\`"
              echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "### Error candidates"
              echo '```text'
              grep -nEi 'error TS|ERROR|Error:|failed|FAILED|exit code|not found|No such|patch.*fail' /tmp/gate5-build.log | tail -n 60 || true
              echo '```'
              echo
              echo "### Build tail"
              echo '```text'
              tail -n 180 /tmp/gate5-build.log
              echo '```'
            } > /tmp/gate5-issue-comment.md
            if ! gh issue comment 18 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/gate5-issue-comment.md; then
              echo "::warning::Failed to post Gate 5 build diagnostic to issue #18"
            fi
            exit "${status}"
          fi

      - name: Push Gate 5 amd64 image
        shell: bash
        env:
          TARGET_IMAGE: ${{ matrix.image }}:${{ env.VERSION }}
        run: docker push "${TARGET_IMAGE}"

  manifest:
    name: Publish amd64 Gate 5 manifest
    needs:
      - init
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish single-architecture version manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ env.VERSION }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
