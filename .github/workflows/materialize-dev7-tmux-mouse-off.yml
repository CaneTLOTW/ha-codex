name: Materialize dev.7 ttyd selection experiment

on:
  push:
    branches:
      - deployment
    paths:
      - ".github/workflows/materialize-dev7-tmux-mouse-off.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment
        uses: actions/checkout@v6
        with:
          ref: deployment
          fetch-depth: 0

      - name: Restore native desktop ttyd path
        shell: bash
        run: |
          set -euo pipefail
          git checkout f72553b843a89c8fb9304b16428beb3cda9f9a63 -- \
            codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch \
            codex/ttyd-mobile-keys/README.md \
            codex/tests/test_modernization.py
          python3 .github/scripts/materialize_dev7_ttyd_selection.py

      - name: Verify experiment
        shell: bash
        run: |
          set -euo pipefail
          bash -n codex/rootfs/usr/local/bin/codex-session
          test "$(find codex/ttyd-mobile-keys -maxdepth 1 -name '*.patch' -type f | wc -l)" -eq 1
          rm -rf /tmp/ttyd-check
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-check
          git -C /tmp/ttyd-check apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-check apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-check diff --check
          python3 -m unittest discover -s codex/tests -v
          git diff --check

      - name: Commit experiment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex/rootfs/usr/local/bin/codex-session \
            codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch \
            codex/ttyd-mobile-keys/README.md \
            codex/tests/test_modernization.py
          git diff --cached --check
          git commit -m "fix: let ttyd own desktop mouse selection"
          git push origin HEAD:deployment
