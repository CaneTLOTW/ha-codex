name: Materialize dev.10 iOS selection

on:
  push:
    branches:
      - deployment
    paths:
      - ".github/workflows/materialize-dev10-ios-selection.yml"
      - ".github/scripts/materialize_dev10_ios_selection.py"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment
        uses: actions/checkout@v6
        with:
          ref: deployment
          fetch-depth: 0

      - name: Prepare clean ttyd 1.7.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ttyd-dev10
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-dev10

      - name: Materialize iOS selection fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_dev10_ios_selection.py

      - name: Build customized ttyd frontend
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ttyd-dev10/html
          corepack enable
          yarn install --immutable
          yarn check
          yarn inline

      - name: Regenerate single canonical ttyd patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('/tmp/ttyd-dev10')
          target = Path('codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch')
          patch = subprocess.check_output(
              ['git', '-C', str(source), 'diff', '--no-ext-diff', '--binary'],
              text=True,
          )
          normalized = []
          for line in patch.splitlines():
              if line.startswith('+') and not line.startswith('+++') and line[1:].strip() == '':
                  normalized.append('+')
              elif line.startswith('-') and not line.startswith('---') and line[1:].strip() == '':
                  normalized.append('-')
              elif line.startswith(' ') and line[1:].strip() == '':
                  normalized.append('')
              else:
                  normalized.append(line.rstrip())
          target.write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY

      - name: Verify experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(find codex/ttyd-mobile-keys -maxdepth 1 -name '*.patch' -type f | wc -l)" -eq 1
          rm -rf /tmp/ttyd-verify
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-verify
          git -C /tmp/ttyd-verify apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-verify apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-verify diff --check
          python3 -m unittest discover -s codex/tests -v
          git diff --check

      - name: Commit experiment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch \
            codex/ttyd-mobile-keys/README.md \
            codex/tests/test_modernization.py \
            codex/config.yaml
          git diff --cached --check
          git commit -m "fix: harden native iOS selection and paste"
          git push origin HEAD:deployment
