name: Materialize dev.3 touch-only terminal gate

on:
  push:
    branches:
      - deployment
    paths:
      - ".github/workflows/materialize-dev3-touch-gate.yml"

permissions:
  contents: write

concurrency:
  group: materialize-dev3-touch-gate
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment
        uses: actions/checkout@v6
        with:
          ref: deployment
          fetch-depth: 0

      - name: Materialize touch-only mobile path against clean ttyd 1.7.7
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-1.7.7
          git -C /tmp/ttyd-1.7.7 apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"

          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/ttyd-1.7.7')

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          terminal = root / 'html/src/components/terminal/index.tsx'
          marker = "];\n\nexport class Terminal extends Component<Props, State> {"
          detector = r'''];

function shouldUseTouchControls(targetWindow: Window): boolean {
    const navigator = targetWindow.navigator as Navigator & {
        maxTouchPoints?: number;
        userAgentData?: { mobile?: boolean };
    };
    const touchPoints = navigator.maxTouchPoints ?? 0;
    if (touchPoints <= 0) return false;

    const mobilePlatform =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') ||
        (navigator.platform === 'MacIntel' && touchPoints > 1) ||
        navigator.userAgentData?.mobile === true;
    const coarseTouch =
        targetWindow.matchMedia?.('(hover: none) and (pointer: coarse)').matches === true ||
        targetWindow.matchMedia?.('(any-pointer: coarse)').matches === true;

    return mobilePlatform || coarseTouch;
}

export class Terminal extends Component<Props, State> {'''
          replace_once(terminal, marker, detector, 'insert touch detector')
          replace_once(
              terminal,
              '    private xterm: Xterm;\n    private touchStartY?: number;\n',
              '    private xterm: Xterm;\n    private touchStartY?: number;\n    private readonly touchControls = shouldUseTouchControls(window);\n',
              'add touchControls flag',
          )

          old_render = r'''            <div id={id}>
                <div
                    class="terminal-viewport"
                    ref={c => (this.container = c as HTMLElement)}
                    onTouchStart={this.startTouchScroll}
                    onTouchMove={this.continueTouchScroll}
                    onTouchEnd={this.finishTouchScroll}
                    onTouchCancel={this.cancelTouchScroll}
                />
                <nav class="mobile-keys" aria-label="Terminal special keys">
                    {mobileKeys.slice(2, 7).map(this.renderMobileKey)}
                    {this.renderSelectionMode(selectionMode)}
                    {mobileKeys.slice(7, 8).map(this.renderMobileKey)}
                    {this.renderKeyboardShow()}
                    {mobileKeys.slice(0, 2).map(this.renderMobileKey)}
                    {this.renderModifier('Ctrl', ctrl, 'ctrl')}
                    {this.renderModifier('Alt', alt, 'alt')}
                    {this.renderModifier('Shift', shift, 'shift')}
                    {this.renderShiftLock(shiftLock)}
                    {mobileKeys.slice(8, 9).map(this.renderMobileKey)}
                    {this.renderKeyboardDismiss()}
                </nav>'''
          new_render = r'''            <div
                id={id}
                class={this.touchControls ? 'ttyd-touch-controls' : undefined}
                ref={c => {
                    if (!this.touchControls) this.container = c as HTMLElement;
                }}
            >
                {this.touchControls && (
                    <div
                        class="terminal-viewport"
                        ref={c => (this.container = c as HTMLElement)}
                        onTouchStart={this.startTouchScroll}
                        onTouchMove={this.continueTouchScroll}
                        onTouchEnd={this.finishTouchScroll}
                        onTouchCancel={this.cancelTouchScroll}
                    />
                )}
                {this.touchControls && (
                    <nav class="mobile-keys" aria-label="Terminal special keys">
                        {mobileKeys.slice(2, 7).map(this.renderMobileKey)}
                        {this.renderSelectionMode(selectionMode)}
                        {mobileKeys.slice(7, 8).map(this.renderMobileKey)}
                        {this.renderKeyboardShow()}
                        {mobileKeys.slice(0, 2).map(this.renderMobileKey)}
                        {this.renderModifier('Ctrl', ctrl, 'ctrl')}
                        {this.renderModifier('Alt', alt, 'alt')}
                        {this.renderModifier('Shift', shift, 'shift')}
                        {this.renderShiftLock(shiftLock)}
                        {mobileKeys.slice(8, 9).map(this.renderMobileKey)}
                        {this.renderKeyboardDismiss()}
                    </nav>
                )}'''
          replace_once(terminal, old_render, new_render, 'gate mobile render tree')

          xterm = root / 'html/src/components/terminal/xterm/index.ts'
          old_detector = r'''function shouldUseNativeTouchSelection(targetWindow: Window): boolean {
    const navigator = targetWindow.navigator as Navigator & { maxTouchPoints?: number };
    const appleTouchDevice =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints ?? 0) > 1);
    const coarsePointer = targetWindow.matchMedia?.('(hover: none) and (pointer: coarse)').matches ?? true;
    return appleTouchDevice && coarsePointer;
}'''
          new_detector = r'''function shouldUseNativeTouchSelection(targetWindow: Window): boolean {
    const navigator = targetWindow.navigator as Navigator & {
        maxTouchPoints?: number;
        userAgentData?: { mobile?: boolean };
    };
    const touchPoints = navigator.maxTouchPoints ?? 0;
    if (touchPoints <= 0) return false;

    const mobilePlatform =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') ||
        (navigator.platform === 'MacIntel' && touchPoints > 1) ||
        navigator.userAgentData?.mobile === true;
    const coarseTouch =
        targetWindow.matchMedia?.('(hover: none) and (pointer: coarse)').matches === true ||
        targetWindow.matchMedia?.('(any-pointer: coarse)').matches === true;

    return mobilePlatform || coarseTouch;
}'''
          replace_once(xterm, old_detector, new_detector, 'generalize native touch detector')
          replace_once(
              xterm,
              "        if (!window.matchMedia('(hover: none), (pointer: coarse), (max-width: 768px)').matches) {\n            this.terminal?.focus();\n        }",
              "        if (!shouldUseNativeTouchSelection(window)) {\n            this.terminal?.focus();\n        }",
              'remove viewport-width focus heuristic',
          )

          style = root / 'html/src/style/index.scss'
          replace_once(style, '  display: flex;\n  flex-direction: column;\n', '', 'remove global flex')
          replace_once(
              style,
              '  .terminal-viewport {\n    flex: 1 1 auto;\n    min-height: 0;\n  }\n',
              '',
              'remove global mobile viewport sizing',
          )
          replace_once(
              style,
              '@media (hover: none), (pointer: coarse), (max-width: 768px) {\n  .terminal-viewport {\n    overflow: hidden;\n  }\n\n',
              '#terminal-container.ttyd-touch-controls {\n  display: flex;\n  flex-direction: column;\n\n  .terminal-viewport {\n    flex: 1 1 auto;\n    min-height: 0;\n    overflow: hidden;\n  }\n\n',
              'scope mobile CSS to detected touch controls',
          )
          PY

          cd /tmp/ttyd-1.7.7/html
          corepack enable
          yarn install --immutable
          yarn inline
          cd "$GITHUB_WORKSPACE"

          git -C /tmp/ttyd-1.7.7 diff -- \
            html/src/components/terminal/index.tsx \
            html/src/components/terminal/xterm/index.ts \
            html/src/style/index.scss \
            html/src/template.html \
            > codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch

          # Keep the canonical patch itself free of whitespace-only lines while
          # preserving a form accepted by git apply (same normalization used by
          # the existing canonical patch).
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch')
          lines = path.read_text(encoding='utf-8').splitlines()
          path.write_text('\n'.join('' if not line.strip() else line for line in lines) + '\n', encoding='utf-8')
          PY

          rm -rf /tmp/ttyd-check
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-check
          git -C /tmp/ttyd-check apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-check apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-check diff --check

      - name: Update regression expectations and patch documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test = Path('codex/tests/test_modernization.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              '        self.assertIn("shouldUseNativeTouchSelection", patch)\n',
              '        self.assertIn("shouldUseNativeTouchSelection", patch)\n'
              '        self.assertIn("shouldUseTouchControls", patch)\n'
              '        self.assertIn("maxTouchPoints", patch)\n'
              '        self.assertIn("Android|iPhone|iPad|iPod", patch)\n'
              '        self.assertIn("userAgentData?.mobile", patch)\n'
              '        self.assertIn("any-pointer: coarse", patch)\n'
              '        self.assertIn("this.touchControls && (", patch)\n'
              '        self.assertIn("ttyd-touch-controls", patch)\n'
          )
          old = (
              '        # Desktop xterm drag-selection must not be clipped by the mobile layout wrapper.\n'
              '        self.assertNotIn("+    min-height: 0;\\n+    overflow: hidden;\\n+  }\\n+  .terminal {", patch)\n'
              '        self.assertIn("+@media (hover: none), (pointer: coarse), (max-width: 768px) {\\n+  .terminal-viewport {\\n+    overflow: hidden;", patch)\n'
          )
          new = (
              '        # Desktop must stay on ttyd/xterm\'s native DOM/event path; mobile layout is JS touch-gated.\n'
              '        self.assertIn("+#terminal-container.ttyd-touch-controls {", patch)\n'
              '        self.assertIn("+    if (!this.touchControls) this.container = c as HTMLElement;", patch)\n'
              '        self.assertNotIn("(max-width: 768px)", patch)\n'
              '        self.assertNotIn("+@media (hover: none), (pointer: coarse)", patch)\n'
          )
          if old not in text:
              raise SystemExit('desktop/mobile regression assertion block not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('codex/ttyd-mobile-keys/README.md')
          doc = readme.read_text(encoding='utf-8')
          note = '''\n### Touch-only mobile activation\n\nThe mobile keybar, swipe handlers, DOM selection mode, and mobile viewport wrapper are activated only when the browser reports real touch capability (`navigator.maxTouchPoints > 0`) together with a mobile/tablet platform signal or a coarse touch pointer. iOS/iPadOS (including desktop-style iPad user agents) and Android are covered. A narrow desktop browser window no longer activates the mobile path.\n'''
          if '### Touch-only mobile activation' not in doc:
              readme.write_text(doc.rstrip() + '\n' + note, encoding='utf-8')
          PY

          python3 -m unittest discover -s codex/tests -v
          git diff --check

      - name: Commit materialized dev.3 code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch \
            codex/ttyd-mobile-keys/README.md \
            codex/tests/test_modernization.py
          git diff --cached --check
          git commit -m "fix: isolate mobile terminal path to touch devices"
          git push origin HEAD:deployment
