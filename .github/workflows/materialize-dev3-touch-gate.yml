name: Materialize dev.3 touch-only terminal gate

on:
  push:
    branches:
      - deployment
    paths:
      - ".github/workflows/materialize-dev3-touch-gate.yml"
      - ".github/scripts/materialize_dev3_touch_gate.py"

permissions:
  contents: write

concurrency:
  group: materialize-dev3-touch-gate
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment
        uses: actions/checkout@v6
        with:
          ref: deployment
          fetch-depth: 0

      - name: Build final source from clean ttyd 1.7.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ttyd-1.7.7 /tmp/ttyd-check
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-1.7.7
          git -C /tmp/ttyd-1.7.7 apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          python3 .github/scripts/materialize_dev3_touch_gate.py
          cd /tmp/ttyd-1.7.7/html
          corepack enable
          yarn install --immutable
          yarn inline
          cd "$GITHUB_WORKSPACE"
          git -C /tmp/ttyd-1.7.7 diff -- html/src/components/terminal/index.tsx html/src/components/terminal/xterm/index.ts html/src/style/index.scss html/src/template.html > codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch
          python3 -c "from pathlib import Path; p=Path('codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch'); lines=p.read_text(encoding='utf-8').splitlines(); p.write_text('\\n'.join('' if not line.strip() else line for line in lines)+'\\n', encoding='utf-8')"

      - name: Verify one canonical patch against clean upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(find codex/ttyd-mobile-keys -maxdepth 1 -name '*.patch' -type f | wc -l)" -eq 1
          git clone --depth 1 --branch 1.7.7 https://github.com/tsl0922/ttyd.git /tmp/ttyd-check
          git -C /tmp/ttyd-check apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-check apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"
          git -C /tmp/ttyd-check diff --check
          python3 -m unittest discover -s codex/tests -v
          git diff --check

      - name: Commit regenerated canonical patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch codex/ttyd-mobile-keys/README.md codex/tests/test_modernization.py
          git diff --cached --check
          git commit -m "fix: isolate mobile terminal path to touch devices"
          git push origin HEAD:deployment
