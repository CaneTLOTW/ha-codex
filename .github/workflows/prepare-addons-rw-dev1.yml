name: Prepare addons-rw deployment candidate

on:
  push:
    branches:
      - work/addons-rw-dev1

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/addons-rw-dev1
          fetch-depth: 0

      - name: Prepare deployment candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("repository.yaml", "name: CaneTLOTW HA Codex App", "name: CaneTLOTW HA Codex (Deployment)")

          config = Path("codex/config.yaml")
          text = config.read_text(encoding="utf-8")
          replacements = {
              "name: Codex\n": "name: Codex Deployment\n",
              "description: OpenAI Codex App for Home Assistant with terminal access, model controls, and optional Home Assistant MCP integration\n": "description: Experimental OpenAI Codex App for Home Assistant - deployment channel with writable local App source access\n",
              'version: "0.4.9"\n': 'version: "0.4.10-dev.1"\n',
              "boot: auto\n": "boot: manual\nstage: experimental\n",
              "panel_title: Codex\n": "panel_title: Codex Deployment\n",
              "  - type: backup\n": "  - type: backup\n  - type: addons\n    read_only: false\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"config.yaml expected exactly one match: {old!r}")
              text = text.replace(old, new, 1)
          config.write_text(text, encoding="utf-8")

          replace_once(
              "codex/apparmor.txt",
              "  /backup/ r,\n  /backup/** r,\n",
              "  /backup/ r,\n  /backup/** r,\n  /addons/ rw,\n  /addons/** rwk,\n",
          )

          changelog = Path("codex/CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "All notable changes to this project will be documented in this file.\n\n"
          entry = (
              "## [0.4.10-dev.1] - 2026-09-09\n\n"
              "### Added\n"
              "- Add a writable Home Assistant `addons` mapping so local App source trees are available inside Codex at `/addons` for development and administrative workflows.\n"
              "- Extend the AppArmor policy and regression coverage for intentional read/write access to `/addons`.\n\n"
              "### Changed\n"
              "- Re-baseline the deployment channel on the current `0.4.9` stable state, retaining bundled Codex CLI `0.153.4`, before testing the new mount.\n"
              "- Document that `/addons` grants broad write access to all local App sources and is distinct from per-App configuration under `/addon_configs`.\n\n"
          )
          if text.count(marker) != 1 or entry in text:
              raise SystemExit("unexpected changelog state")
          changelog.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          replace_once(
              "codex/DOCS.md",
              "| `/backup` | read-only | Home Assistant backups |\n",
              "| `/backup` | read-only | Home Assistant backups |\n| `/addons` | read-write | Local Home Assistant App source trees |\n",
          )
          replace_once(
              "codex/DOCS.md",
              "Inside this App, `/homeassistant` corresponds to the Home Assistant Core `/config` directory.\n",
              "Inside this App, `/homeassistant` corresponds to the Home Assistant Core `/config` directory.\n\n`/addons` intentionally exposes the complete local Home Assistant App source tree with write access. This is intended for development/administration work such as creating or updating a local App. A Codex session that can write there can modify **any** local App source, not only the project currently being worked on. The separate `all_addon_configs` mapping would expose installed Apps' public configuration directories under `/addon_configs`; it is not enabled here.\n",
          )

          replace_once(
              "codex/README.md",
              "| `/backup` | Backups | read-only |\n",
              "| `/backup` | Backups | read-only |\n| `/addons` | Local Home Assistant App source trees | read-write |\n",
          )
          replace_once(
              "codex/README.md",
              "When documentation or a prompt refers to Home Assistant Core `/config`, use `/homeassistant` inside this App.\n",
              "When documentation or a prompt refers to Home Assistant Core `/config`, use `/homeassistant` inside this App.\n\nThe `/addons` mount is intentionally broad and writable so Codex can develop and maintain local Home Assistant Apps directly. Treat it as privileged development access: a session can create, replace, or delete source files for any local App. This is different from `all_addon_configs`, which would expose installed Apps' public configuration directories under `/addon_configs`.\n",
          )

          replace_once(
              "README.md",
              "- Read-only access to `/ssl` and `/backup`.\n",
              "- Read-only access to `/ssl` and `/backup`.\n- Writable access to local Home Assistant App sources under `/addons` for development/administration workflows.\n",
          )

          tests = Path("codex/tests/test_modernization.py")
          text = tests.read_text(encoding="utf-8")
          const_marker = 'SUDOERS = CODEX_DIR / "rootfs/etc/sudoers.d/codex-hass-mcp"\n'
          const_add = const_marker + 'CONFIG = CODEX_DIR / "config.yaml"\nAPPARMOR = CODEX_DIR / "apparmor.txt"\n'
          if text.count(const_marker) != 1:
              raise SystemExit("test constants marker mismatch")
          text = text.replace(const_marker, const_add, 1)

          method_marker = "    def test_web_session_keeps_scrollback(self):\n"
          method = (
              "    def test_local_app_sources_are_rw_mapped_and_apparmor_allowed(self):\n"
              "        config = CONFIG.read_text(encoding=\"utf-8\")\n"
              "        apparmor = APPARMOR.read_text(encoding=\"utf-8\")\n"
              "        self.assertRegex(config, r\"(?ms)^  - type: addons\\n    read_only: false$\")\n"
              "        self.assertNotIn(\"all_addon_configs\", config)\n"
              "        self.assertIn(\"/addons/ rw,\", apparmor)\n"
              "        self.assertIn(\"/addons/** rwk,\", apparmor)\n\n"
          )
          if text.count(method_marker) != 1:
              raise SystemExit("test method insertion marker mismatch")
          text = text.replace(method_marker, method + method_marker, 1)
          tests.write_text(text, encoding="utf-8")

          Path(".github/workflows/prepare-addons-rw-dev1.yml").unlink()
          PY

      - name: Commit prepared candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add writable local App source access"
          git push origin HEAD:work/addons-rw-dev1
