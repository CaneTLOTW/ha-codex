name: Apply deployment runtime acceptance fixes

on:
  push:
    branches:
      - deployment
    paths:
      - ".github/workflows/apply-deployment-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add narrow read-only Home Assistant CLI helper
        shell: bash
        run: |
          cat > codex/rootfs/usr/local/bin/ha-readonly <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec sudo -n /usr/local/bin/ha-readonly-root-helper "$@"
          EOF

          cat > codex/rootfs/usr/local/bin/ha-readonly-root-helper <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          TOKEN_FILE="${CODEX_SUPERVISOR_TOKEN_FILE:-/tmp/codex/ha-token}"

          deny() {
            echo "[ERROR] ha-readonly permits only: core info, core check, core logs" >&2
            exit 64
          }

          [[ $# -eq 2 ]] || deny
          [[ "$1" == "core" ]] || deny
          case "$2" in
            info|check|logs) ;;
            *) deny ;;
          esac

          if [[ ! -r "$TOKEN_FILE" ]]; then
            echo "[ERROR] Supervisor token file is not readable: $TOKEN_FILE" >&2
            exit 1
          fi

          SUPERVISOR_TOKEN="$(<"$TOKEN_FILE")"
          if [[ -z "$SUPERVISOR_TOKEN" ]]; then
            echo "[ERROR] Supervisor token is empty" >&2
            exit 1
          fi
          export SUPERVISOR_TOKEN

          exec /usr/local/bin/ha "$@"
          EOF

          cat > codex/rootfs/etc/sudoers.d/codex-hass-mcp <<'EOF'
          %root ALL=(root) NOPASSWD: /usr/local/bin/hass-mcp-root-helper, /usr/local/bin/ha-readonly-root-helper
          EOF

      - name: Update runtime guidance, packaging, tests and deployment version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("codex/Dockerfile", "        7z \\\n        dig \\", "        7z \\\n        ha-readonly \\\n        dig \\")
          replace_once("codex/Dockerfile", "    /usr/local/bin/hass-mcp-wrapper \\\n    /usr/local/bin/hass-mcp-root-helper \\", "    /usr/local/bin/hass-mcp-wrapper \\\n    /usr/local/bin/hass-mcp-root-helper \\\n    /usr/local/bin/ha-readonly \\\n    /usr/local/bin/ha-readonly-root-helper \\")

          start = Path("codex/rootfs/usr/local/bin/codex-start")
          text = start.read_text()
          marker = "## Reading Home Assistant Logs\n"
          tools = """## Bundled Runtime Tools\n\nThis App image includes a Home Assistant-oriented toolbox. Prefer these tools instead of assuming they need to be installed:\n\n- Runtime/scripting: `python3` (with PyYAML), `bash`, `node`, `npm`\n- Source control: `git`, `gh`\n- Search/data: `jq`, `yq`, `yamllint`, `rg`, `grep`, `sed`, `gawk`, `find`, `sqlite3`\n- Network/remote: `curl`, `openssl`, `ssh`, `scp`, `sftp`, `dig`, `nslookup`, `nc`, `mosquitto_pub`, `mosquitto_sub`, `rsync`\n- Files/session: `file`, `tree`, `7z`, `zip`, `unzip`, `nano`, `vim`, `tmux`\n- Home Assistant: the `homeassistant` MCP server and the authenticated read-only wrapper `ha-readonly`\n\nFor Home Assistant state/entity queries, prefer the `homeassistant` MCP tools. For Supervisor-backed Core diagnostics use only:\n\n```bash\nha-readonly core info\nha-readonly core check\nha-readonly core logs\n```\n\nThe raw `ha` binary is installed, but the Supervisor token is intentionally removed from the interactive Codex shell. A direct `ha core ...` call can therefore return `unauthorized`; this is expected and is not a missing-tool error. `ha-readonly` exposes only the three diagnostic commands above and does not reveal the token to Codex.\n\n"""
          if marker not in text:
              raise SystemExit("AGENTS marker missing")
          text = text.replace(marker, tools + marker, 1)
          text = text.replace("ha core logs 2>&1 | tail -100", "ha-readonly core logs 2>&1 | tail -100")
          text = text.replace("ha core logs 2>&1 | grep -i keyword", "ha-readonly core logs 2>&1 | grep -i keyword")
          text = text.replace("ha core logs 2>&1 | grep -iE \"(error|exception)\"", "ha-readonly core logs 2>&1 | grep -iE \"(error|exception)\"")
          start.write_text(text)

          readme = Path("codex/README.md")
          text = readme.read_text()
          old_row = "| Home Assistant | Home Assistant CLI (`ha`), bundled `hass-mcp` helper |"
          new_row = "| Home Assistant | Home Assistant CLI binary (`ha`), authenticated read-only wrapper (`ha-readonly`), bundled `hass-mcp` helper |"
          if old_row in text:
              text = text.replace(old_row, new_row, 1)
          anchor = "The App contains an **SSH client only**. It does not run or expose an inbound SSH server. All commands execute inside the App container and are constrained by its AppArmor profile, mounted Home Assistant paths and the selected Codex permission mode.\n"
          extra = """\nThe interactive Codex shell intentionally does **not** receive the Supervisor token. The raw `ha` CLI is present for completeness, but authenticated Core diagnostics are exposed through the narrow `ha-readonly` wrapper instead. It permits only `ha-readonly core info`, `ha-readonly core check`, and `ha-readonly core logs`; mutations remain unavailable through that wrapper. Entity/state work should normally use the managed `homeassistant` MCP server.\n"""
          if extra.strip() not in text:
              if anchor not in text:
                  raise SystemExit("README anchor missing")
              text = text.replace(anchor, anchor + extra, 1)
          readme.write_text(text)

          replace_once("codex/config.yaml", 'version: "0.4.4-dev.1"', 'version: "0.4.4-dev.2"')

          tests = Path("codex/tests/test_modernization.py")
          text = tests.read_text()
          const_anchor = 'OLD_PATCH = CODEX_DIR / "ttyd-selection-clipboard.patch"\n'
          consts = '''HA_READONLY = CODEX_DIR / "rootfs/usr/local/bin/ha-readonly"\nHA_READONLY_ROOT = CODEX_DIR / "rootfs/usr/local/bin/ha-readonly-root-helper"\nSUDOERS = CODEX_DIR / "rootfs/etc/sudoers.d/codex-hass-mcp"\n'''
          if "HA_READONLY =" not in text:
              text = text.replace(const_anchor, const_anchor + consts, 1)
          mobile_anchor = "        self.assertFalse(OLD_PATCH.exists())\n"
          mobile_extra = '''        # Desktop xterm drag-selection must not be clipped by the mobile layout wrapper.\n        self.assertNotIn("+    min-height: 0;\\n+    overflow: hidden;\\n+  }\\n+  .terminal {", patch)\n        self.assertIn("+@media (hover: none), (pointer: coarse), (max-width: 768px) {\\n+  .terminal-viewport {\\n+    overflow: hidden;", patch)\n'''
          if "Desktop xterm drag-selection" not in text:
              text = text.replace(mobile_anchor, mobile_anchor + mobile_extra, 1)
          method_anchor = "    def test_web_session_keeps_scrollback(self):\n"
          method = '''    def test_readonly_ha_helper_and_agent_guidance(self):\n        root = HA_READONLY_ROOT.read_text(encoding="utf-8")\n        wrapper = HA_READONLY.read_text(encoding="utf-8")\n        sudoers = SUDOERS.read_text(encoding="utf-8")\n        start_text = START.read_text(encoding="utf-8")\n        dockerfile = DOCKERFILE.read_text(encoding="utf-8")\n\n        self.assertIn("ha-readonly-root-helper", wrapper)\n        self.assertIn('[[ $# -eq 2 ]] || deny', root)\n        self.assertIn('[[ "$1" == "core" ]] || deny', root)\n        self.assertIn("info|check|logs", root)\n        self.assertIn("SUPERVISOR_TOKEN=", root)\n        self.assertIn("exec /usr/local/bin/ha", root)\n        self.assertIn("ha-readonly-root-helper", sudoers)\n        self.assertIn("ha-readonly core info", start_text)\n        self.assertIn("ha-readonly core check", start_text)\n        self.assertIn("ha-readonly core logs", start_text)\n        self.assertIn("Supervisor token is intentionally removed", start_text)\n        self.assertIn("ha-readonly", dockerfile)\n\n'''
          if "def test_readonly_ha_helper_and_agent_guidance" not in text:
              text = text.replace(method_anchor, method + method_anchor, 1)
          tests.write_text(text)
          PY

      - name: Regenerate the single canonical ttyd patch against clean 1.7.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ttyd-work
          mkdir -p /tmp/ttyd-work
          curl -fsSL https://github.com/tsl0922/ttyd/archive/refs/tags/1.7.7.tar.gz | tar -xz -C /tmp/ttyd-work --strip-components=1
          git -C /tmp/ttyd-work init -q
          git -C /tmp/ttyd-work config user.name baseline
          git -C /tmp/ttyd-work config user.email baseline@example.invalid
          git -C /tmp/ttyd-work add .
          git -C /tmp/ttyd-work commit -qm baseline
          git -C /tmp/ttyd-work apply "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ttyd-work/html/src/style/index.scss')
          text = p.read_text()
          old = '''  .terminal-viewport {\n    flex: 1 1 auto;\n    min-height: 0;\n    overflow: hidden;\n  }\n'''
          new = '''  .terminal-viewport {\n    flex: 1 1 auto;\n    min-height: 0;\n  }\n'''
          if old not in text:
              raise SystemExit('global terminal-viewport overflow block not found')
          text = text.replace(old, new, 1)
          media = '''@media (hover: none), (pointer: coarse), (max-width: 768px) {\n  .terminal-viewport,\n'''
          replacement = '''@media (hover: none), (pointer: coarse), (max-width: 768px) {\n  .terminal-viewport {\n    overflow: hidden;\n  }\n\n  .terminal-viewport,\n'''
          if media not in text:
              raise SystemExit('mobile media-query anchor not found')
          p.write_text(text.replace(media, replacement, 1))
          PY

          git -C /tmp/ttyd-work diff --no-ext-diff -- . > codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch')
          out = []
          for line in p.read_text().splitlines():
              if line.strip() == '':
                  out.append('')
              elif line[0] in '+-' and line[1:].strip() == '':
                  out.append(line[0])
              else:
                  out.append(line.rstrip())
          p.write_text('\n'.join(out) + '\n')
          PY
          test -s codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch

          rm -rf /tmp/ttyd-check
          mkdir -p /tmp/ttyd-check
          curl -fsSL https://github.com/tsl0922/ttyd/archive/refs/tags/1.7.7.tar.gz | tar -xz -C /tmp/ttyd-check --strip-components=1
          git -C /tmp/ttyd-check apply --check "$GITHUB_WORKSPACE/codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch"

      - name: Validate changes before commit
        shell: bash
        run: |
          chmod +x codex/rootfs/usr/local/bin/ha-readonly codex/rootfs/usr/local/bin/ha-readonly-root-helper
          bash -n codex/rootfs/usr/local/bin/ha-readonly
          bash -n codex/rootfs/usr/local/bin/ha-readonly-root-helper
          bash -n codex/rootfs/usr/local/bin/codex-start
          python3 codex/tests/test_modernization.py
          git diff --check
          test "$(find codex/ttyd-mobile-keys -maxdepth 1 -name '*.patch' | wc -l)" -eq 1

      - name: Commit deployment fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex
          git diff --cached --check
          git commit -m "fix: harden deployment diagnostics and desktop selection"
          git push origin HEAD:deployment
