name: Update Codex CLI

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-codex-cli
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check for a new Codex CLI release
        id: version
        run: bash scripts/update-codex-version.sh

      - name: Commit and publish update
        if: steps.version.outputs.changed == 'true'
        env:
          CODEX_VERSION: ${{ steps.version.outputs.codex_version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/Dockerfile codex/config.yaml codex/CHANGELOG.md
          git commit -m "chore: update Codex CLI to ${CODEX_VERSION}"
          git push origin HEAD:main
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-codex.yml/dispatches" \
            --data '{"ref":"main"}'
