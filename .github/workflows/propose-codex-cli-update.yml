name: Update Codex CLI

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-codex-cli
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check for a new Codex CLI release
        id: version
        run: bash scripts/update-codex-version.sh

      - name: Commit update
        if: steps.version.outputs.changed == 'true'
        env:
          CODEX_VERSION: ${{ steps.version.outputs.codex_version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/Dockerfile codex/config.yaml codex/CHANGELOG.md
          git commit -m "chore: update Codex CLI to ${CODEX_VERSION}"
          git push origin HEAD:main

      - name: Publish updated Codex App
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Pushes performed with GITHUB_TOKEN do not recursively start
          # push-triggered workflows. workflow_dispatch is the supported
          # exception, so explicitly start the publisher after the commit.
          gh workflow run publish-codex.yml --ref main
