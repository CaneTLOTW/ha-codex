name: Temporary dev.12 materializer

on:
  push:
    branches:
      - deployment
    paths:
      - .github/workflows/dev12-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deployment

      - name: Materialize TypeScript compatibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch')
          text = path.read_text(encoding='utf-8')
          old = '+    private keyboardCleanup?: () => void;'
          new = '+    private keyboardCleanup: any;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one cleanup declaration, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git diff -- codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch

      - name: Commit canonical patch update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex/ttyd-mobile-keys/ttyd-1.7.7-mobile-keys.patch
          git commit -m 'fix: keep dev.12 cleanup field ttyd-compatible'
          git push origin HEAD:deployment
