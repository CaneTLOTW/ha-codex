name: Codex SSH Hotfix Test
description: Isolated local build for SSH ACL hotfix issue 26
version: "0.4.28-test.26.1"
slug: codex_issue26
url: https://github.com/CaneTLOTW/ha-codex
arch:
  - amd64
  - aarch64
startup: application
boot: manual
stage: experimental
init: true
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:code-braces
panel_title: Codex Hotfix Test
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: ssl
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: backup
  - type: addons
    read_only: false
options:
  enable_mcp: true
  terminal_font_size: 14
  terminal_theme: dark
  working_directory: /homeassistant
  session_persistence: false
  default_model: "gpt-5.6-sol"
  codex_permissions: workspace
  codex_approval_policy: on-request
  addons_access: read_only
  mcp_servers: []
  environment_variables: []
schema:
  enable_mcp: bool
  terminal_font_size: int(10,24)
  terminal_theme: list(dark|light)
  working_directory: str
  session_persistence: bool
  default_model: list(gpt-6-astra|gpt-6.1-sol|gpt-6.1-terra|gpt-6-sol|gpt-6-luna|gpt-5.6-sol|gpt-5.6-terra|gpt-5.6-luna|gpt-5.5)
  codex_permissions: list(workspace|full_access)
  codex_approval_policy: list(on-request|never|untrusted)
  addons_access: list(read_only|read_write)
  mcp_servers:
    - name: str
      url: url
      bearer_token: password?
  environment_variables:
    - name: str
      value: password
environment:
  TERM: xterm-256color
