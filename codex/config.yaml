name: Codex Deployment
description: Experimental Codex App for Home Assistant development channel
version: "0.5.0-dev.13"
slug: codex
url: https://github.com/CaneTLOTW/ha-codex
image: ghcr.io/canetlotw/ha-codex
arch:
  - amd64
  - aarch64
startup: application
boot: manual
stage: experimental
init: true
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:code-braces
panel_title: Codex Deployment
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: ssl
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: backup
  - type: addons
    read_only: false
  # Developer-only: public configuration directories of other HA Apps.
  # Supervisor mounts are static; App options cannot revoke this RO mount.
  - type: all_app_configs
    read_only: true
    path: /app_configs
options:
  enable_mcp: true
  terminal_font_size: 14
  terminal_theme: dark
  working_directory: /homeassistant
  session_persistence: false
  remote_control_enabled: false
  file_transfer_enabled: false
  clipboard_image_paste: true
  direct_file_upload: true
  app_configs_visibility: hidden_from_guidance
  default_model: "gpt-5.6-sol"
  codex_permissions: workspace
  codex_approval_policy: on-request
  addons_access: read_only
  mcp_servers: []
  environment_variables: []
schema:
  enable_mcp: bool
  terminal_font_size: int(10,24)
  terminal_theme: list(dark|light)
  working_directory: str
  session_persistence: bool
  remote_control_enabled: bool
  file_transfer_enabled: bool
  clipboard_image_paste: bool
  direct_file_upload: bool
  app_configs_visibility: list(hidden_from_guidance|show_read_only)
  default_model: list(gpt-6.2-sol|gpt-6.2-astra|gpt-6-astra|gpt-6.1-sol|gpt-6.1-terra|gpt-6-sol|gpt-6-luna|gpt-5.6-sol|gpt-5.6-terra|gpt-5.6-luna|gpt-5.5)
  codex_permissions: list(workspace|full_access)
  codex_approval_policy: list(on-request|never|untrusted)
  addons_access: list(read_only|read_write)
  mcp_servers:
    - name: str
      url: url
      bearer_token: password?
  environment_variables:
    - name: str
      value: password
environment:
  TERM: xterm-256color
