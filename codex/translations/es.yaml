configuration:
  enable_mcp:
    name: Habilitar MCP de Home Assistant
    description: >-
      Habilita el servidor MCP incluido de Home Assistant para interacción
      directa con entidades y servicios desde Codex.
  terminal_font_size:
    name: Tamaño de fuente del terminal
    description: >-
      Tamaño de fuente del terminal web en píxeles (10-24).
  terminal_theme:
    name: Tema del terminal
    description: >-
      Elige el tema claro u oscuro para el terminal web.
  working_directory:
    name: Directorio de trabajo
    description: >-
      Directorio predeterminado cuando inicia Codex. Usa /homeassistant para
      acceder directamente a la configuración de Home Assistant.
  direct_file_upload:
    name: Subir archivos y carpetas directamente
    description: >-
      Añade una barra compacta de carga en el escritorio y un botón de clip en iPhone.
      Archivos de hasta 10 MiB (24 por selección) se guardan de forma privada
      mediante el WebSocket Ingress y sus rutas se pegan en Codex.
  clipboard_image_paste:
    name: Pegar capturas con Ctrl+V
    description: >-
      Pega capturas PNG directamente en Codex con Ctrl+V. El WebSocket ya
      autenticado de Home Assistant guarda imagenes privadas y pega su ruta.
      Limite de 10 MiB por imagen. Activo por defecto en la App.
  file_transfer_enabled:
    name: Habilitar transferencia de archivos (experimental)
    description: >-
      Habilita trzsz para enviar archivos y carpetas. Sal de Codex con Ctrl+C
      y ejecuta codex-upload en la consola. Pegar capturas con Ctrl+V aun no
      esta implementado. Guarda y reinicia la App.
  app_configs_visibility:
    name: Mostrar configuraciones de otras Apps en las instrucciones
    description: >-
      Solo controla la informacion mostrada a Codex. El montaje /app_configs
      existe siempre en esta App y es de solo lectura.
      No es una restriccion de seguridad; el montaje de Supervisor es estatico.
  remote_control_enabled:
    name: Activar Remote Control
    description: >-
      Ejecuta el servicio oficial de Codex Remote Control junto al terminal.
      Desactivado por defecto. Guarda y reinicia la App para aplicar el ajuste;
      vincula el cliente iOS por separado.
  session_persistence:
    name: Persistencia de sesión
    description: >-
      Mantiene la sesión del terminal web mediante tmux entre recargas y
      desconexiones del navegador.
  default_model:
    name: Modelo predeterminado
    description: >-
      Modelo de inicio persistente para Codex. El modelo se puede cambiar
      durante la sesión con /model.
  codex_permissions:
    name: Nivel de acceso de Codex
    description: >-
      Workspace permite trabajo normal del proyecto. Full access utiliza
      danger-full-access y elimina las restricciones locales del sandbox.
  codex_approval_policy:
    name: Política de aprobación de Codex
    description: >-
      Controla cuándo Codex pide confirmación: on-request, untrusted o never.
  addons_access:
    name: Acceso a Apps locales (/addons)
    description: >-
      read_only permite a Codex leer las fuentes de Apps locales. read_write
      también permite modificarlas. Con read_only, full access se reduce de
      forma efectiva a workspace para mantener /addons fuera de las rutas escribibles.
  mcp_servers:
    name: Servidores MCP adicionales
    description: >-
      Gestiona servidores MCP remotos Streamable HTTP. Cada servidor necesita
      un nombre único y una URL HTTP(S). El bearer token opcional se proporciona
      mediante una variable de entorno en vez de escribirse directamente en
      config.toml.
    fields:
      name:
        name: Nombre
        description: Nombre único del servidor MCP. homeassistant está reservado.
      url:
        name: URL
        description: Endpoint MCP Streamable HTTP que empieza por http:// o https://.
      bearer_token:
        name: Bearer token
        description: Token opcional para autenticarse en este servidor MCP.
  environment_variables:
    name: Variables de entorno
    description: >-
      Variables adicionales disponibles para las sesiones de Codex. Los valores
      se guardan en las opciones de la App de Home Assistant, así que añade solo
      credenciales destinadas a Codex o a sus servidores MCP.
    fields:
      name:
        name: Nombre
        description: Nombre de variable de entorno, por ejemplo EXAMPLE_TENANT.
      value:
        name: Valor
        description: Valor proporcionado al entorno del proceso de Codex.
network:
  7681/tcp: Terminal web (ttyd)
