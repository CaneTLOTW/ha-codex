configuration:
  enable_mcp:
    name: Habilitar MCP de Home Assistant
    description: >-
      Habilita el servidor MCP incluido de Home Assistant para interacción
      directa con entidades y servicios desde Codex.
  terminal_font_size:
    name: Tamaño de fuente del terminal
    description: >-
      Tamaño de fuente del terminal web en píxeles (10-24).
  terminal_theme:
    name: Tema del terminal
    description: >-
      Elige el tema claro u oscuro para el terminal web.
  working_directory:
    name: Directorio de trabajo
    description: >-
      Directorio predeterminado cuando inicia Codex. Usa /homeassistant para
      acceder directamente a la configuración de Home Assistant.
  session_persistence:
    name: Persistencia de sesión
    description: >-
      Mantiene la sesión del terminal web mediante tmux entre recargas y
      desconexiones del navegador.
  default_model:
    name: Modelo predeterminado
    description: >-
      Modelo de inicio persistente para Codex. El modelo se puede cambiar
      durante la sesión con /model.
  codex_permissions:
    name: Nivel de acceso de Codex
    description: >-
      Workspace permite trabajo normal del proyecto. Full access utiliza
      danger-full-access y elimina las restricciones locales del sandbox.
  codex_approval_policy:
    name: Política de aprobación de Codex
    description: >-
      Controla cuándo Codex pide confirmación: on-request, untrusted o never.
  mcp_servers:
    name: Servidores MCP adicionales
    description: >-
      Gestiona servidores MCP remotos Streamable HTTP. Cada servidor necesita
      un nombre único y una URL HTTP(S). El bearer token opcional se proporciona
      mediante una variable de entorno en vez de escribirse directamente en
      config.toml.
    fields:
      name:
        name: Nombre
        description: Nombre único del servidor MCP. homeassistant está reservado.
      url:
        name: URL
        description: Endpoint MCP Streamable HTTP que empieza por http:// o https://.
      bearer_token:
        name: Bearer token
        description: Token opcional para autenticarse en este servidor MCP.
  environment_variables:
    name: Variables de entorno
    description: >-
      Variables adicionales disponibles para las sesiones de Codex. Los valores
      se guardan en las opciones de la App de Home Assistant, así que añade solo
      credenciales destinadas a Codex o a sus servidores MCP.
    fields:
      name:
        name: Nombre
        description: Nombre de variable de entorno, por ejemplo EXAMPLE_TENANT.
      value:
        name: Valor
        description: Valor proporcionado al entorno del proceso de Codex.
network:
  7681/tcp: Terminal web (ttyd)
