configuration:
  enable_mcp:
    name: Home-Assistant-MCP aktivieren
    description: >-
      Aktiviert den mitgelieferten Home-Assistant-MCP-Server, damit Codex
      Entitäten abfragen und Dienste aufrufen kann.
  terminal_font_size:
    name: Terminal-Schriftgröße
    description: >-
      Schriftgröße des Web-Terminals in Pixeln (10-24).
  terminal_theme:
    name: Terminal-Design
    description: >-
      Helles oder dunkles Farbschema für das Web-Terminal.
  working_directory:
    name: Arbeitsverzeichnis
    description: >-
      Standard-Arbeitsverzeichnis beim Start von Codex. /homeassistant erlaubt
      direkten Zugriff auf die Home-Assistant-Konfiguration.
  direct_file_upload:
    name: Dateien und Ordner direkt hochladen
    description: >-
      Zeigt eine schmale Upload-Leiste auf dem Desktop und eine Büroklammer
      auf dem iPhone an. Dateien/Bilder bis 10 MiB je Datei sowie bis zu
      24 Dateien pro Auswahl werden über die bestehende Ingress-Verbindung
      privat gespeichert und ihre Pfade in Codex eingefügt. Keine Shell nötig.
  clipboard_image_paste:
    name: Screenshots direkt mit Strg+V einfügen
    description: >-
      Ermöglicht PNG-Screenshots direkt in der laufenden Codex-TUI per Strg+V.
      Die Bilder werden über die bestehende HA-Ingress-WebSocket-Verbindung
      privat gespeichert und als Bilddateipfad an Codex übergeben. Kein
      zusätzlicher Port. Maximal 10 MiB pro PNG. Standardmäßig in dieser App
      aktiv; zum Abschalten speichern und App neu starten.
  file_transfer_enabled:
    name: Dateiübertragung aktivieren (experimentell)
    description: >-
      Aktiviert trzsz für Datei- und Verzeichnis-Uploads über das ttyd-Terminal.
      Nach dem Verlassen von Codex mit Strg+C den Befehl codex-upload eingeben.
      Screenshots mit Strg+V funktionieren unabhängig davon bereits über die Screenshot-Einstellung. Nach dem Speichern
      die App neu starten; bei lokalem HTTP können Browserfunktionen eingeschränkt sein.
  app_configs_visibility:
    name: Andere App-Konfigurationen in Codex-Anleitung anzeigen
    description: >-
      Steuert NUR, ob Codex Hinweise zu /app_configs erhält. Die öffentlichen
      App-Konfigurationen sind in dieser App unabhängig davon bereits
      schreibgeschützt eingebunden. Dies ist KEIN Sicherheits- oder Zugriffs-
      schalter; zum vollständigen Entzug ist eine App ohne diesen Mount nötig.
  remote_control_enabled:
    name: Remote Control aktivieren
    description: >-
      Startet den offiziellen Codex-Remote-Control-Dienst zusätzlich zum
      Terminal. Standardmäßig aus. Nach Speichern die App neu starten;
      iOS-Verbindung separat koppeln.
  session_persistence:
    name: Sitzung beibehalten
    description: >-
      Hält die Web-Terminal-Sitzung mit tmux über Browser-Neuladen und
      Verbindungsabbrüche hinweg aktiv.
  default_model:
    name: Standardmodell
    description: >-
      Modell, mit dem Codex standardmäßig startet. Während einer Sitzung kann
      das Modell weiterhin mit /model gewechselt werden.
  codex_permissions:
    name: Codex-Zugriff
    description: >-
      Workspace erlaubt normale Projektarbeit. Vollzugriff entspricht
      danger-full-access und entfernt lokale Codex-Sandbox-Beschränkungen.
  codex_approval_policy:
    name: Codex-Bestätigungsrichtlinie
    description: >-
      Legt fest, wann Codex vor Aktionen nachfragt: on-request, untrusted oder
      never.
  addons_access:
    name: Zugriff auf lokale Apps (/addons)
    description: >-
      read_only erlaubt Codex nur Lesezugriff. read_write erlaubt Änderungen an
      lokalen Home-Assistant-Apps. Bei read_only wird ein konfigurierter
      Vollzugriff aus Sicherheitsgründen effektiv auf Workspace begrenzt.
  mcp_servers:
    name: Zusätzliche MCP-Server
    description: >-
      Verwaltet zusätzliche entfernte Streamable-HTTP-MCP-Server. Jeder Server
      benötigt einen eindeutigen Namen und eine HTTP(S)-URL. Ein optionaler
      Bearer-Token wird nicht im Klartext in config.toml geschrieben, sondern
      der Codex-Prozessumgebung bereitgestellt.
    fields:
      name:
        name: Name
        description: Eindeutiger MCP-Servername. homeassistant ist reserviert.
      url:
        name: URL
        description: Streamable-HTTP-MCP-Endpunkt mit http:// oder https://.
      bearer_token:
        name: Bearer-Token
        description: Optionaler Bearer-Token zur Anmeldung an diesem MCP-Server.
  environment_variables:
    name: Umgebungsvariablen
    description: >-
      Zusätzliche Umgebungsvariablen für Codex-Sitzungen. Werte werden in den
      Home-Assistant-App-Optionen gespeichert; daher nur Zugangsdaten
      hinterlegen, die für Codex oder seine MCP-Server bestimmt sind.
    fields:
      name:
        name: Name
        description: Name der Umgebungsvariable, zum Beispiel EXAMPLE_TENANT.
      value:
        name: Wert
        description: Wert, der der Codex-Prozessumgebung bereitgestellt wird.
network:
  7681/tcp: Web-Terminal (ttyd)
