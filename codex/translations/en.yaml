configuration:
  enable_mcp:
    name: Enable Home Assistant MCP
    description: >-
      Enable the bundled Home Assistant MCP server for direct entity and
      service interaction from Codex.
  terminal_font_size:
    name: Terminal Font Size
    description: >-
      Font size for the web terminal in pixels (10-24).
  terminal_theme:
    name: Terminal Theme
    description: >-
      Choose the dark or light color theme for the web terminal.
  working_directory:
    name: Working Directory
    description: >-
      Default working directory when Codex starts. Use /homeassistant for
      direct access to Home Assistant configuration files.
  direct_file_upload:
    name: Upload files and folders directly
    description: >-
      Adds a compact desktop upload dock and a one-tap iPhone paperclip picker.
      Files and images up to 10 MiB each (24 per selection) use the
      existing authenticated Ingress WebSocket and private Codex storage.
      Paths are pasted into the running terminal without exiting Codex.
  clipboard_image_paste:
    name: Paste screenshots with Ctrl+V
    description: >-
      Paste PNG screenshots directly into a running Codex TUI using Ctrl+V.
      The existing authenticated HA ingress WebSocket stores images privately
      and pastes their paths into Codex. No extra port. Limit 10 MiB per PNG.
      Enabled by default in dieser App; restart the App after changing it.
  file_transfer_enabled:
    name: Enable file transfer (experimental)
    description: >-
      Enables trzsz file and folder uploads in the ttyd terminal. Exit Codex
      with Ctrl+C and run codex-upload in the shell. Screenshot Ctrl+V is not
      implemented yet. Save and restart the App. Browser security restrictions
      may affect file pickers on non-HTTPS local origins.
  app_configs_visibility:
    name: Show other App config paths in Codex guidance
    description: >-
      Controls ONLY whether Codex receives /app_configs usage guidance. This
      Developer image always mounts public App config directories read-only.
      This is NOT an access-control switch. Removing this privilege requires
      installing an App image without the static Supervisor mount.
  remote_control_enabled:
    name: Enable Remote Control
    description: >-
      Run the official Codex Remote Control service alongside the terminal.
      Off by default. Save settings and restart the App to apply the switch;
      pair the iOS client separately.
  session_persistence:
    name: Session Persistence
    description: >-
      Keep the web terminal session in tmux across browser refreshes and
      disconnects.
  default_model:
    name: Default Model
    description: >-
      Persistent startup model for Codex. Users can still switch models during
      a session with /model.
  codex_permissions:
    name: Codex Access Level
    description: >-
      Workspace enables normal project work. Full access maps to
      danger-full-access and removes local Codex sandbox restrictions.
  codex_approval_policy:
    name: Codex Approval Policy
    description: >-
      Controls when Codex asks before running actions: on-request, untrusted,
      or never.
  addons_access:
    name: Local Apps Access (/addons)
    description: >-
      read_only lets Codex read local Home Assistant App sources. read_write
      also permits changes. With read_only, configured full access is reduced
      to effective workspace mode so /addons can stay outside writable roots.
  mcp_servers:
    name: Additional MCP Servers
    description: >-
      Manage additional remote Streamable HTTP MCP servers. Each server needs
      a unique name and HTTP(S) URL; an optional bearer token is kept out of
      config.toml and supplied through the Codex process environment.
    fields:
      name:
        name: Name
        description: Unique MCP server name. The name homeassistant is reserved.
      url:
        name: URL
        description: Streamable HTTP MCP endpoint beginning with http:// or https://.
      bearer_token:
        name: Bearer Token
        description: Optional bearer token used to authenticate to this MCP server.
  environment_variables:
    name: Environment Variables
    description: >-
      Additional environment variables supplied to Codex sessions. Values are
      stored in Home Assistant App options, so only add credentials intended
      for Codex or its MCP servers.
    fields:
      name:
        name: Name
        description: Environment variable name, for example EXAMPLE_TENANT.
      value:
        name: Value
        description: Value supplied to the Codex process environment.
network:
  7681/tcp: Web Terminal (ttyd)
