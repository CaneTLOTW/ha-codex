configuration:
  enable_mcp:
    name: Habilitar MCP do Home Assistant
    description: >-
      Habilita o servidor MCP incluído do Home Assistant para interação direta
      com entidades e serviços pelo Codex.
  terminal_font_size:
    name: Tamanho da fonte do terminal
    description: >-
      Tamanho da fonte do terminal web em pixels (10-24).
  terminal_theme:
    name: Tema do terminal
    description: >-
      Escolha o tema claro ou escuro para o terminal web.
  working_directory:
    name: Diretório de trabalho
    description: >-
      Diretório padrão quando o Codex inicia. Use /homeassistant para acesso
      direto à configuração do Home Assistant.
  session_persistence:
    name: Persistência da sessão
    description: >-
      Mantém a sessão do terminal web via tmux entre recarregamentos e
      desconexões do navegador.
  default_model:
    name: Modelo padrão
    description: >-
      Modelo persistente de inicialização do Codex. O modelo ainda pode ser
      alterado durante a sessão com /model.
  codex_permissions:
    name: Nível de acesso do Codex
    description: >-
      Workspace permite trabalho normal no projeto. Full access usa
      danger-full-access e remove as restrições locais do sandbox.
  codex_approval_policy:
    name: Política de aprovação do Codex
    description: >-
      Controla quando o Codex pede confirmação: on-request, untrusted ou never.
  mcp_servers:
    name: Servidores MCP adicionais
    description: >-
      Gerencia servidores MCP remotos Streamable HTTP. Cada servidor precisa de
      um nome exclusivo e uma URL HTTP(S). O bearer token opcional é fornecido
      por uma variável de ambiente em vez de ser gravado diretamente em
      config.toml.
    fields:
      name:
        name: Nome
        description: Nome exclusivo do servidor MCP. homeassistant é reservado.
      url:
        name: URL
        description: Endpoint MCP Streamable HTTP iniciado por http:// ou https://.
      bearer_token:
        name: Bearer token
        description: Token opcional para autenticação neste servidor MCP.
  environment_variables:
    name: Variáveis de ambiente
    description: >-
      Variáveis adicionais disponibilizadas às sessões do Codex. Os valores são
      armazenados nas opções do App do Home Assistant; adicione apenas
      credenciais destinadas ao Codex ou aos seus servidores MCP.
    fields:
      name:
        name: Nome
        description: Nome da variável de ambiente, por exemplo EXAMPLE_TENANT.
      value:
        name: Valor
        description: Valor fornecido ao ambiente do processo do Codex.
network:
  7681/tcp: Terminal web (ttyd)
